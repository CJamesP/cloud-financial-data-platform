services:
  postgres:
    image: postgres:17
    container_name: financial-postgres
    environment:
      POSTGRES_DB: financial_data
      POSTGRES_USER: financial_app
      POSTGRES_PASSWORD: financial_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: financial-api
    environment:
      DATABASE_URL: postgresql+psycopg://financial_app:financial_dev_password@postgres:5432/financial_data
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: