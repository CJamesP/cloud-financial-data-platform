services:
  postgres:
    image: postgres:17
    container_name: financial-postgres
    environment:
      POSTGRES_DB: financial_data
      POSTGRES_USER: financial_app
      POSTGRES_PASSWORD: financial_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: